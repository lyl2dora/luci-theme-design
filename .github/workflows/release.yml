name: Release

on:
  push:
    tags:
      - 'v*'
  repository_dispatch:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: '编译 SDK 版本 (ImmortalWrt)'
        required: true
        default: '25.12.1'
        type: choice
        options:
        - 25.12.1
        - 25.12.0
        - 24.10.6
      upload_release:
        description: '发布 Release（不勾则只产出 Artifact）'
        required: false
        type: boolean
        default: true

env:
  SDK_VERSION: ${{ inputs.sdk_version || '25.12.1' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # 发布 Release 需要写权限，仓库默认可能是只读
    permissions:
      contents: write
    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo -e "Total CPU cores\t: $(nproc)"
          free -h
          uname -a
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gettext git \
            libncurses-dev libssl-dev python3-setuptools rsync swig unzip \
            zlib1g-dev file wget zstd

      - name: Download SDK
        run: |
          BASE="https://downloads.immortalwrt.org/releases/${SDK_VERSION}/targets/x86/64"
          # SDK 文件名里带 gcc 版本，随发行版本变化，这里从目录索引里探测
          SDK="$(curl -fsSL "$BASE/" \
            | grep -oE 'immortalwrt-sdk-[^"]+\.Linux-x86_64\.tar\.(zst|xz)' \
            | sort -u | head -1)"
          [ -n "$SDK" ] || { echo "::error::未能在 $BASE/ 找到 SDK"; exit 1; }
          echo "USE SDK=$SDK"
          wget -q --show-progress "$BASE/$SDK"
          case "$SDK" in
            *.tar.zst) tar --zstd -xf "$SDK" ;;
            *.tar.xz)  tar -xJf "$SDK" ;;
          esac
          mv "${SDK%.tar.*}" openwrt-sdk

      - name: Build
        id: build
        run: |
          mkdir -p openwrt-sdk/package/luci-theme-design
          tar -cf - --exclude=.git --exclude=preview --exclude=openwrt-sdk . \
            | tar -xf - -C openwrt-sdk/package/luci-theme-design
          cd openwrt-sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "CONFIG_PACKAGE_luci-theme-design=y" >> .config
          make defconfig
          make package/luci-theme-design/compile V=s -j$(nproc)

          TARGET="$(find bin/ -name 'luci-theme-design*' \( -name '*.apk' -o -name '*.ipk' \) | head -1)"
          [ -n "$TARGET" ] || { echo "::error::未生成安装包"; exit 1; }
          NAME="$(basename "$TARGET")"
          # luci-theme-design-8.0-r20260813.apk -> 8.0-r20260813
          VERSION="${NAME#luci-theme-design-}"
          VERSION="${VERSION%.apk}"
          VERSION="${VERSION%.ipk}"

          echo "TARGET=$(pwd)/$TARGET"
          {
            echo "TARGET=$(pwd)/$TARGET"
            echo "NAME=$NAME"
            echo "VERSION=$VERSION"
            echo "status=success"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### 构建成功"
            echo
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 安装包 | \`$NAME\` |"
            echo "| 体积 | $(du -h "$TARGET" | cut -f1) |"
            echo "| SDK | ImmortalWrt ${SDK_VERSION} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Artifact 无条件产出，不给开关
      - name: Upload to artifact
        uses: actions/upload-artifact@v7
        if: steps.build.outputs.status == 'success' && !cancelled()
        with:
          name: luci-theme-design-${{ env.SDK_VERSION }}
          path: ${{ steps.build.outputs.TARGET }}
          if-no-files-found: error

      # Release 的归属需要一个 tag，这是 GitHub 的硬性要求。
      # 在 tag 上跑就沿用该 tag，否则用包版本号造一个（指向当前 commit）。
      # 注意：这里只决定 tag 叫什么，不决定要不要发 Release。
      - name: Resolve release tag
        id: tag
        if: steps.build.outputs.status == 'success' && (github.event_name == 'push' || inputs.upload_release) && !cancelled()
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) TAG="${GITHUB_REF#refs/tags/}" ;;
            *)           TAG="v${{ steps.build.outputs.VERSION }}" ;;
          esac
          echo "TAG=$TAG"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "本次 Release tag：\`$TAG\`（指向 ${GITHUB_SHA:0:7}）" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        if: steps.build.outputs.status == 'success' && (github.event_name == 'push' || inputs.upload_release) && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ steps.tag.outputs.TAG }}
          tag_name: ${{ steps.tag.outputs.TAG }}
          # 分支上跑时 tag 尚不存在，由 action 创建并指向当前 commit
          target_commitish: ${{ github.sha }}
          prerelease: false
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.build.outputs.TARGET }}
            LICENSE
